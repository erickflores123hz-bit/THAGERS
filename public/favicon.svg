<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141416" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#e2c044" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#e2c044" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" stroke="url(#gold)" stroke-width="14" />

  <!-- Inner Subtle Border -->
  <rect x="24" y="24" width="464" height="464" rx="90" fill="none" stroke="rgba(226, 192, 68, 0.25)" stroke-width="2" stroke-dasharray="8 6" />

  <!-- Gothic Monogram "T" -->
  <g filter="url(#glow)">
    <!-- Top Bar with gothic flared horns -->
    <path d="M 100 130 C 130 110, 170 120, 200 120 L 312 120 C 342 120, 382 110, 412 130 C 392 165, 360 170, 312 170 L 290 170 L 290 390 C 290 415, 320 420, 340 425 L 340 450 L 172 450 L 172 425 C 192 420, 222 415, 222 390 L 222 170 L 200 170 C 152 170, 120 165, 100 130 Z" fill="url(#gold)" />
    
    <!-- Central diamond star accent -->
    <polygon points="256,60 266,85 291,95 266,105 256,130 246,105 221,95 246,85" fill="#fef08a" />
  </g>
</svg>
